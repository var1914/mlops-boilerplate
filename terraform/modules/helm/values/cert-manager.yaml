# cert-manager — TLS certificates for Istio ingress (Let's Encrypt via ClusterIssuer).

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

prometheus:
  enabled: true
  servicemonitor:
    enabled: true

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
