# Airflow Helm values.yaml

# Custom Docker image
images:
  airflow:
    repository: localhost:5050/custom-airflow
    tag: 0.0.10
    pullPolicy: Always

# Executor
executor: "KubernetesExecutor"

# Webserver
webserver:
  defaultUser:
    enabled: true
    username: admin
    password: admin123
  waitForMigrations:
    enabled: false

# Shared initContainer — runs as root before every Airflow component starts,
# ensures the log PVC directory is writable by uid 50000 (airflow user).
# Applied to scheduler, dag-processor, api-server, triggerer, AND task pods.
extraInitContainers:
  - name: fix-log-perms
    image: localhost:5050/custom-airflow:0.0.10
    imagePullPolicy: Always
    securityContext:
      runAsUser: 0
    command: ["sh", "-c", "chmod -R 777 /opt/airflow/logs && chown -R 50000:0 /opt/airflow/logs"]
    volumeMounts:
      - name: logs
        mountPath: /opt/airflow/logs

# Scheduler
scheduler:
  waitForMigrations:
    enabled: false

# Triggerer
triggerer:
  waitForMigrations:
    enabled: false
  persistence:
    enabled: false    # use shared logs.persistence.existingClaim instead

# Dag Processor
dagProcessor:
  waitForMigrations:
    enabled: false

# API Server (Airflow 3.0)
apiServer:
  waitForMigrations:
    enabled: false

# DAGs persistence - disabled because DAGs are baked into custom Docker image
dags:
  persistence:
    enabled: false

# Workers
workers:
  persistence:
    enabled: true

# Logs - local-path is ReadWriteOnce, but all Airflow pods land on the same node
# (desktop-worker) so multiple pods CAN mount the same RWO PVC simultaneously.
logs:
  persistence:
    enabled: true
    existingClaim: airflow-logs-pvc

# Disable built-in PostgreSQL - use external
postgresql:
  enabled: false

# External PostgreSQL connection
data:
  metadataConnection:
    host: postgresql
    port: 5432
    user: airflow
    pass: airflow123
    db: airflow
    protocol: postgresql

# Disable migration wait - we already ran migrations
waitForMigrations:
  enabled: false

# Disable migration job (already done)
migrateDatabaseJob:
  enabled: false

# Config
config:
  core:
    load_examples: "False"
    dags_folder: /opt/airflow/dags/airflow_dags
  database:
    migrations_wait_timeout: 300
  logging:
    remote_logging: "False"
    colored_console_log: "True"

# Environment variables (applied to all Airflow components)
env:
  - name: PYTHONPATH
    value: /opt/airflow/dags:/opt/airflow/dags/ml:/opt/airflow/src:/opt/airflow
  - name: AIRFLOW__LOGGING__BASE_LOG_FOLDER
    value: /opt/airflow/logs
  - name: AIRFLOW__DATABASE__MIGRATIONS_WAIT_TIMEOUT
    value: "300"
  - name: MLFLOW_TRACKING_URI
    value: http://ml-mlflow:5000
  - name: MINIO_ENDPOINT
    value: minio:9000
  - name: MINIO_ACCESS_KEY
    value: admin
  - name: MINIO_SECRET_KEY
    value: admin123
  - name: DB_HOST
    value: postgresql
  - name: DB_PORT
    value: "5432"
  - name: DB_USER
    value: crypto
  - name: DB_PASSWORD
    value: crypto123
  - name: DB_NAME
    value: crypto
  - name: REDIS_HOST
    value: ml-redis-master
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
    value: redis123
  # Airflow 3.0: task SDK subprocesses must call back to the api-server over HTTP.
  # Default is localhost:8080 which fails when scheduler and api-server are separate pods.
  - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
    value: "http://airflow-api-server:8080/execution/"
  # JWT signing key — must match the airflow-jwt-secret K8s secret.
  # The bootstrap script pre-patches that secret to this same value after helm install,
  # so both are identical and it doesn't matter which env var Kubernetes picks.
  - name: AIRFLOW__API_AUTH__JWT_SECRET
    value: "cF1A7mWl4zbZNwUyySQHxg"
  - name: AIRFLOW__CORE__INTERNAL_API_SECRET_KEY
    value: "dOMrAGQ+s6g0hWCK+u0Qxvn+fP4MJEvMlHlCC+ffAvo="
  # MLflow artifact storage — task pods need S3 creds to write model files to MinIO
  - name: MLFLOW_S3_ENDPOINT_URL
    value: "http://minio:9000"
  - name: AWS_ACCESS_KEY_ID
    value: admin
  - name: AWS_SECRET_ACCESS_KEY
    value: admin123
