apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-prediction-api
  namespace: ml-pipeline
  labels:
    app: crypto-prediction-api
    component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crypto-prediction-api
  template:
    metadata:
      labels:
        app: crypto-prediction-api
        component: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: localhost:5050/crypto-api:0.0.7
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000

        env:
        - name: ENVIRONMENT
          value: production
        - name: DEBUG
          value: "false"
        # PostgreSQL — crypto database for feature engineering
        - name: DB_HOST
          value: postgresql
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: crypto
        - name: DB_USER
          value: crypto
        - name: DB_PASSWORD
          value: crypto123
        # Redis — feature caching
        - name: REDIS_HOST
          value: ml-redis-master
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: redis123
        # MinIO — model artifacts
        - name: MINIO_ENDPOINT
          value: minio:9000
        - name: MINIO_ACCESS_KEY
          value: admin
        - name: MINIO_SECRET_KEY
          value: admin123
        - name: MINIO_SECURE
          value: "false"
        # MLflow — model registry
        - name: MLFLOW_TRACKING_URI
          value: http://ml-mlflow:5000
        - name: MLFLOW_S3_ENDPOINT_URL
          value: http://minio:9000
        - name: AWS_ACCESS_KEY_ID
          value: admin
        - name: AWS_SECRET_ACCESS_KEY
          value: admin123
        # API config
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        - name: API_LOG_LEVEL
          value: info
        - name: API_CORS_ORIGINS
          value: '["*"]'
        - name: MONITORING_ENABLE_METRICS
          value: "true"
        # Binance symbols for inference
        - name: BINANCE_SYMBOLS
          value: '["BTCUSDT","ETHUSDT","BNBUSDT","ADAUSDT","SOLUSDT","XRPUSDT","DOTUSDT","AVAXUSDT","MATICUSDT","LINKUSDT"]'

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"

        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5

        startupProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 20

        volumeMounts:
        - name: model-cache
          mountPath: /tmp/model_cache

      volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 5Gi
